name: Kromora
format_version: 2
id_prefix: KRMA
description: Native macOS RAW photo editor
default_board: product
statuses:
  - backlog
  - ready
  - claimed
  - blocked
  - review
  - verification
  - done
git:
  mode: manual
  auto_commit: false
  target_branch: main
  branch_per_issue: false
agents:
  claim_ttl_minutes: 60
  default_actor: codex
  supported:
    - cursor
    - claude
    - opencode
    - codex
    - pi
  ai_ticket_creation: ready
  options:
    cursor:
      skip_permissions: true
    claude:
      skip_permissions: true
    opencode:
      skip_permissions: true
    codex:
      skip_permissions: true
    pi:
      skip_permissions: true
  pickup:
    enabled: true
    yolo: true
    runner:
      kind: codex
      model: gpt-6-luna
    max_concurrency: 1
    labels: []
    context_budget: 12000
    retry:
      on_limit: true
      fallback_delay_minutes: 60
    worktrees:
      enabled: false
  verification:
    enabled: true
    max_concurrency: 1
    default_actor: pi
    runner:
      kind: pi
    action_mode: safe_fixes
    completion: auto
    different_agent: warn
    merge_on_done: false
